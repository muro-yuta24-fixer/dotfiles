[terminal]
shell = "/usr/bin/fish"

[window.dimensions]
columns = 160
lines = 40

[window]
decorations_theme_variant = "Dark"

[font.normal]
# family = "HackGen Console NF"
family = "PlemolJP Console NF"
style = "Text"

[font.italic]
style = "Text Italic"

[font]
size = 12

# Solarized Osaka Dark
[colors.primary]
background = "#001419"
foreground = "#839395"
dim_foreground = "#576d74"
bright_foreground = "#9eabac"

[colors.cursor]
text = "#001419"
cursor = "#839395"

[colors.vi_mode_cursor]
text = "#001419"
cursor = "#268bd3"

[colors.search.matches]
foreground = "#001419"
background = "#637981"

[colors.search.focused_match]
foreground = "#001419"
background = "#849900"

[colors.footer_bar]
foreground = "#9eabac"
background = "#063540"

[colors.hints.start]
foreground = "#001419"
background = "#b28500"

[colors.hints.end]
foreground = "#001419"
background = "#637981"

[colors.selection]
text = "CellForeground"
background = "#1a6397"

[colors.normal]
black = "#063540"
red = "#db302d"
green = "#849900"
yellow = "#b28500"
blue = "#268bd3"
magenta = "#d23681"
cyan = "#29a298"
white = "#9eabac"

[colors.bright]
black = "#576d74"
red = "#db302d"
green = "#849900"
yellow = "#b28500"
blue = "#268bd3"
magenta = "#d23681"
cyan = "#29a298"
white = "#adb7b7"

[[colors.indexed_colors]]
index = 16
color = "#c94c16"

[[colors.indexed_colors]]
index = 17
color = "#f55350"
