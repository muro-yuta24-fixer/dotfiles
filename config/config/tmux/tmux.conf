# ============================================================================
# General
# ============================================================================

set -g default-shell /usr/bin/fish

# ESCキーの遅延をなくす (Neovim / Claude Code のキー入力用)
set -s escape-time 1

# スクロールバックを増やす (Claude Code など出力の長いTUI向け)
set -g history-limit 50000

# フォーカスイベントをアプリケーションに伝える (Neovimのautoreadなど)
set -g focus-events on

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# 複数クライアント接続時、表示しているウィンドウ単位でサイズを合わせる
setw -g aggressive-resize on

set -g set-titles on
set -g set-titles-string "#T"

# ============================================================================
# Terminal
# ============================================================================

set -g default-terminal "tmux-256color"

# True color
set -as terminal-features ",*:RGB"
# Undercurl / 下線の色
set -as terminal-features ",*:usstyle"

# Extended keys (Shift+Enter などの修飾キー付き入力をアプリへ渡す)
# EnterやBackSpaceが2回押される問題の回避もこれで行う
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys,alacritty*:extkeys"

# OSC 52 でシステムクリップボードへコピーする
set -s set-clipboard on
set -as terminal-features ",*:clipboard"

# パススルー (Claude Code の通知・画像表示などのエスケープシーケンスを外側の端末へ)
set -g allow-passthrough on

# ============================================================================
# Key bindings
# ============================================================================

set -g prefix C-x
unbind-key C-b
bind-key C-x send-prefix

# 現在のディレクトリを引き継いで分割する
bind-key h split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# コピーモードはviキーバインド
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================================================
# Appearance (Catppuccin Latte)
# ============================================================================

set -g mode-style "fg=blue,bg=#ccd0da"

set -g message-style "fg=blue,bg=#ccd0da"
set -g message-command-style "fg=blue,bg=#ccd0da"

set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=blue"

set -g status on
set -g status-position bottom
set -g status-justify left

set -g status-style "fg=blue"

set -g status-left-length 100
set -g status-right-length 500

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#eff1f5,bg=#1e66f5,bold] #S #[fg=#1e66f5,bg=#eff1f5,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1e66f5,bg=#eff1f5,nobold,nounderscore,noitalics]#[fg=#eff1f5,bg=#1e66f5,bold] #h "

setw -g window-status-activity-style "underscore,fg=#9ca0b0,bg=#eff1f5"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#9ca0b0"
setw -g window-status-format "#[fg=#eff1f5,bg=#eff1f5,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#eff1f5,bg=#eff1f5,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#eff1f5,bg=#ccd0da,nobold,nounderscore,noitalics]#[fg=#1e66f5,bg=#ccd0da,bold] #I  #W #F #[fg=#ccd0da,bg=#eff1f5,nobold,nounderscore,noitalics]"
