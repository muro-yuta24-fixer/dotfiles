# ============================================================================
# General
# ============================================================================

set -g default-shell /usr/bin/fish

# ESCキーの遅延をなくす (Neovim / Claude Code のキー入力用)
set -s escape-time 1

# スクロールバックを増やす (Claude Code など出力の長いTUI向け)
set -g history-limit 50000

# フォーカスイベントをアプリケーションに伝える (Neovimのautoreadなど)
set -g focus-events on

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# 複数クライアント接続時、表示しているウィンドウ単位でサイズを合わせる
setw -g aggressive-resize on

set -g set-titles on
set -g set-titles-string "#T"

# ============================================================================
# Terminal
# ============================================================================

set -g default-terminal "tmux-256color"

# True color
set -as terminal-features ",*:RGB"
# Undercurl / 下線の色
set -as terminal-features ",*:usstyle"

# Extended keys (Shift+Enter などの修飾キー付き入力をアプリへ渡す)
# EnterやBackSpaceが2回押される問題の回避もこれで行う
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys,alacritty*:extkeys"

# OSC 52 でシステムクリップボードへコピーする
set -s set-clipboard on
set -as terminal-features ",*:clipboard"

# パススルー (Claude Code の通知・画像表示などのエスケープシーケンスを外側の端末へ)
set -g allow-passthrough on

# ============================================================================
# Key bindings
# ============================================================================

set -g prefix C-x
unbind-key C-b
bind-key C-x send-prefix

# 現在のディレクトリを引き継いで分割する
bind-key h split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# コピーモードはviキーバインド
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================================================
# Appearance (Catppuccin Latte / ピル型)
# ============================================================================

# 角の丸い装飾 (Nerd Font: U+E0B6, U+E0B4) を使う

set -g mode-style "fg=#1e66f5,bg=#ccd0da"

set -g message-style "fg=#1e66f5,bg=#ccd0da"
set -g message-command-style "fg=#1e66f5,bg=#ccd0da"

set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"

set -g status on
set -g status-position top
set -g status-justify absolute-centre

# 背景は端末と同じ色にする
set -g status-style "fg=#4c4f69,bg=default"

set -g status-left-length 100
set -g status-right-length 200

# 左: セッション名
set -g status-left "#[fg=#1e66f5,bg=default]#[fg=#eff1f5,bg=#1e66f5,bold]#S#[fg=#1e66f5,bg=default,nobold]#[default] "

# 右: prefix入力待ち / ホスト名
set -g status-right "#{?client_prefix,#[fg=#fe640b#,bg=default]#[fg=#eff1f5#,bg=#fe640b#,bold]PREFIX#[fg=#fe640b#,bg=default#,nobold]#[default] ,}#[fg=#1e66f5,bg=default]#[fg=#eff1f5,bg=#1e66f5,bold]#h#[fg=#1e66f5,bg=default,nobold]#[default]"

# ウィンドウ: 現在のウィンドウだけピルで強調し、それ以外は同じ幅の余白をとる
# ピルは番号部分を青地、名前部分をグレー地にして番号を強調する
# 非アクティブなタブは、番号の右の丸い装飾の分だけ余白を足して幅を揃える
setw -g window-status-separator " "
setw -g window-status-style "fg=#9ca0b0,bg=default"
setw -g window-status-activity-style "fg=#fe640b,bg=default"
setw -g window-status-bell-style "fg=#fe640b,bg=default,bold"
setw -g window-status-format " #I  #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-format "#[fg=#1e66f5,bg=default]#[fg=#eff1f5,bg=#1e66f5,bold]#I#[fg=#1e66f5,bg=#ccd0da,nobold] #W#{?window_zoomed_flag, 󰁌,}#[fg=#ccd0da,bg=default]#[default]"
